# celld links V8 from our own rusty_v8 build, not denoland's prebuilt
# archive. tools/v8/rusty-v8.sh pin writes this file; docs/v8.md says why.
# This is aarch64-unknown-linux-gnu's pin: build with `cargo --config .cargo/aarch64-unknown-linux-gnu.toml`.
#
# The v8 build script fetches RUSTY_V8_ARCHIVE and checks it against
# RUSTY_V8_ARCHIVE_SHA256 before use. It compiles the binding at
# RUSTY_V8_SRC_BINDING_PATH, kept here in v8/ (the crate's own, from the
# .crate Cargo.lock checks; for a crate pinned by git rev, which has none,
# the one the archive's build generated), and neither downloads nor writes one.
# crates/celld/build.rs checks that file against CELLD_V8_BINDING_SHA256,
# refuses the variables that would bring other V8 code in (a binding mirror
# or URL; trybuild; a source or debug build), and any target but aarch64-unknown-linux-gnu,
# which this archive is for. Every value is forced over the environment.
[env]
CELLD_V8_VERSION = { value = "15.8.62.68", force = true }
RUSTY_V8_ARCHIVE = { value = "https://github.com/finitecomputer/celld/releases/download/rusty_v8-v158.0.0-v8-15.8.62.68/librusty_v8_release_aarch64-unknown-linux-gnu.a.gz", force = true }
RUSTY_V8_ARCHIVE_SHA256 = { value = "715a8f4276055f4dc55a23148383e1088ec634a8acd0634c8deff81382435298", force = true }
RUSTY_V8_SRC_BINDING_PATH = { value = ".cargo/v8/src_binding_release_aarch64-unknown-linux-gnu.rs", relative = true, force = true }
CELLD_V8_BINDING_SHA256 = { value = "216f448e83d744eee02725e8a7bfad9a5d4918347bb4c9b800cd4f53cb860b2d", force = true }
RUSTY_V8_SKIP_DOWNLOAD = { value = "0", force = true }
